name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx nx format:check

      - run: npx nx run-many -t lint -p pos-web pos-api

      - run: npx nx run-many -t test -p pos-web pos-api

      - run: npx nx run-many -t build -p pos-web pos-api
