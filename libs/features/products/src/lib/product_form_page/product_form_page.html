<pos-page-header [title]="title()" />

<form class="product-form" (submit)="submit($event)" novalidate>
  <div class="product-form__grid">
    <pos-field label="SKU">
      <input
        class="product-form__input"
        type="text"
        name="sku"
        required
        [value]="sku()"
        (input)="setSku($event)"
      />
    </pos-field>

    <pos-field label="Nombre">
      <input
        class="product-form__input"
        type="text"
        name="name"
        required
        [value]="name()"
        (input)="setName($event)"
      />
    </pos-field>

    <pos-field label="Precio">
      <input
        class="product-form__input"
        type="text"
        name="price"
        inputmode="decimal"
        placeholder="0.00"
        required
        [value]="price()"
        (input)="setPrice($event)"
      />
    </pos-field>

    <pos-field label="IVA">
      <select
        class="product-form__input"
        name="taxRate"
        [value]="taxRate()"
        (change)="setTaxRate($event)"
      >
        <option [value]="0">0 %</option>
        <option [value]="0.16">16 %</option>
      </select>
    </pos-field>

    <pos-field label="Descripción (opcional)">
      <input
        class="product-form__input"
        type="text"
        name="description"
        [value]="description()"
        (input)="setDescription($event)"
      />
    </pos-field>

    <pos-field label="Existencias">
      <input
        class="product-form__input"
        type="number"
        name="stock"
        min="0"
        [disabled]="!trackStock()"
        [value]="stock()"
        (input)="setStock($event)"
      />
    </pos-field>
  </div>

  <div class="product-form__checks">
    <label class="product-form__check">
      <input
        type="checkbox"
        name="trackStock"
        [checked]="trackStock()"
        (change)="setTrackStock($event)"
      />
      Controlar inventario
    </label>
    <label class="product-form__check">
      <input
        type="checkbox"
        name="active"
        [checked]="active()"
        (change)="setActive($event)"
      />
      Producto activo
    </label>
  </div>

  @if (error()) {
  <p class="product-form__error" role="alert">{{ error() }}</p>
  }

  <div class="product-form__actions">
    <pos-button variant="basic" type="button" (pressed)="cancel()">
      Cancelar
    </pos-button>
    <pos-button
      type="submit"
      variant="primary"
      [disabled]="loading()"
      [loading]="loading()"
    >
      Guardar
    </pos-button>
  </div>
</form>
