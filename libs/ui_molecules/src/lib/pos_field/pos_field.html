<div class="pos-field">
  <!-- El control real viene proyectado por ng-content y el lint no puede verlo. -->
  <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
  <label class="pos-field__label">
    {{ label() }}
    <span class="pos-field__control">
      <ng-content />
    </span>
  </label>
  @if (error()) {
  <span class="pos-field__error" role="alert">{{ error() }}</span>
  }
</div>
